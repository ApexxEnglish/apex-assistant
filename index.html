<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>English Site Assistant — Widget Demo</title>
<style>
  :root{
    --paper:#EFEDE6;
    --ink:#202A44;
    --ink-soft:#4A5570;
    --marigold:#E8B930;
    --marigold-deep:#C9971A;
    --correct:#3F7859;
    --line:#C9C2B4;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html, body{
    margin:0;
    font-family:'IBM Plex Sans', Arial, sans-serif;
    background:transparent;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
    width:100%;
  }
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Lora:ital,wght@0,500;0,600;1,500&display=swap');

  /* Launcher */
  #launcher-wrap{
    position:fixed;
    top:28px;
    right:28px;
    width:60px;
    height:60px;
    z-index:1000;
  }
  #launcher-wrap.opened #pulse-ring,
  #launcher-wrap.opened #pulse-ring-2{ display:none; }
  #launcher-wrap.opened #launcher{ animation:none; }
  #pulse-ring, #pulse-ring-2{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:var(--marigold);
    opacity:0.6;
    animation:pulse-ring 1.8s cubic-bezier(0.3,0,0.5,1) infinite;
    pointer-events:none;
  }
  #pulse-ring-2{
    animation-delay:0.9s;
  }
  @keyframes pulse-ring{
    0%{ transform:scale(1); opacity:0.6; }
    75%{ transform:scale(1.9); opacity:0; }
    100%{ transform:scale(1.9); opacity:0; }
  }
  #launcher{
    position:relative;
    width:60px;
    height:60px;
    border-radius:50%;
    background:var(--ink);
    border:none;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(32,42,68,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1;
    transition:transform 0.2s ease;
    animation:launcher-bounce 2.4s ease-in-out infinite;
  }
  @keyframes launcher-bounce{
    0%, 55%, 100%{ transform:translateY(0); }
    70%{ transform:translateY(-4px); }
    82%{ transform:translateY(0); }
  }
  #launcher:hover{ transform:scale(1.06); }
  #launcher svg{ width:27px; height:27px; }
  #launcher .bubble{
    fill:var(--marigold);
  }
  #launcher .dot{
    fill:var(--ink);
  }

  /* Panel */
  #panel{
    position:fixed;
    top:100px;
    right:28px;
    width:360px;
    max-width:calc(100vw - 40px);
    height:520px;
    max-height:calc(100vh - 140px);
    background:var(--white);
    border-radius:14px;
    box-shadow:0 20px 60px rgba(32,42,68,0.28);
    display:none;
    flex-direction:column;
    overflow:hidden;
    z-index:1000;
    border:1px solid var(--line);
  }
  #panel.open{ display:flex; }

  #panel header{
    background:var(--ink);
    color:var(--white);
    padding:16px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  #panel header .title{
    font-family:'Lora', serif;
    font-weight:600;
    font-size:1rem;
  }
  #panel header .sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    color:var(--marigold);
    margin-top:2px;
    letter-spacing:0.03em;
  }
  #close-btn{
    background:none;
    border:none;
    color:var(--white);
    font-size:1.1rem;
    cursor:pointer;
    opacity:0.7;
    line-height:1;
  }
  #close-btn:hover{ opacity:1; }

  #lang-switch{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    padding:8px 16px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .lang-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.74rem;
    font-weight:600;
    letter-spacing:0.03em;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:100px;
    padding:5px 11px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .lang-btn.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--marigold);
  }

  #messages{
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:12px;
    background:var(--paper);
  }
  .msg{
    max-width:84%;
    padding:10px 13px;
    border-radius:12px;
    font-size:0.88rem;
    line-height:1.5;
    white-space:pre-wrap;
  }
  .msg.user{
    align-self:flex-end;
    background:var(--marigold);
    color:var(--ink);
    border-bottom-right-radius:3px;
  }
  .msg.bot{
    align-self:flex-start;
    background:var(--white);
    color:var(--ink);
    border:1px solid var(--line);
    border-bottom-left-radius:3px;
  }
  .msg.bot .wrong{
    color:#A14444;
    text-decoration:line-through;
    text-decoration-thickness:1.5px;
    opacity:0.75;
  }
  .msg.bot .right{
    color:var(--correct);
    font-weight:600;
  }
  .msg.typing{
    align-self:flex-start;
    background:var(--white);
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
    font-size:0.78rem;
  }

  #input-row{
    display:flex;
    gap:8px;
    padding:12px;
    background:var(--white);
    border-top:1px solid var(--line);
  }
  #input-row input{
    flex:1;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:16px;
    outline:none;
    color:var(--ink);
  }
  #input-row input:focus{
    border-color:var(--marigold-deep);
  }
  #input-row button{
    background:var(--ink);
    color:var(--white);
    border:none;
    border-radius:8px;
    padding:0 16px;
    font-weight:600;
    font-size:0.85rem;
    cursor:pointer;
  }
  #input-row button:disabled{
    opacity:0.5;
    cursor:default;
  }

  .starter-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    padding:0 16px 12px;
    background:var(--paper);
  }
  .starter{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:100px;
    padding:5px 10px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .starter:hover{ border-color:var(--marigold-deep); color:var(--ink); }
</style>
</head>
<body>

<div id="launcher-wrap">
  <div id="pulse-ring"></div>
  <div id="pulse-ring-2"></div>
  <button id="launcher" aria-label="Open chat assistant">
    <svg viewBox="0 0 24 24">
      <path class="bubble" d="M12 3C6.48 3 2 6.69 2 11.25c0 2.52 1.39 4.77 3.58 6.29-.12 1.13-.5 2.42-1.32 3.63a.5.5 0 0 0 .58.76c1.86-.62 3.32-1.5 4.36-2.29A12.6 12.6 0 0 0 12 19.5c5.52 0 10-3.69 10-8.25S17.52 3 12 3z"/>
      <circle class="dot" cx="8.2" cy="11.4" r="1.15"/>
      <circle class="dot" cx="12" cy="11.4" r="1.15"/>
      <circle class="dot" cx="15.8" cy="11.4" r="1.15"/>
    </svg>
  </button>
</div>

<div id="panel">
  <header>
    <div>
      <div class="title" id="header-title">İngilizce pratiğine hazır mısın?</div>
      <div class="sub" id="header-sub">ya da kurs hakkında soru sor</div>
    </div>
    <button id="close-btn" aria-label="Close">✕</button>
  </header>
  <div id="lang-switch">
    <button class="lang-btn active" data-lang="tr">TR</button>
    <button class="lang-btn" data-lang="en">EN</button>
    <button class="lang-btn" data-lang="ru">RU</button>
    <button class="lang-btn" data-lang="fa">FA</button>
    <button class="lang-btn" data-lang="es">ES</button>
    <button class="lang-btn" data-lang="fr">FR</button>
    <button class="lang-btn" data-lang="zh">ZH</button>
    <button class="lang-btn" data-lang="ja">JA</button>
  </div>
  <div id="messages"></div>
  <div class="starter-row" id="starters">
    <div class="starter" data-msg="What levels do you teach?">What levels do you teach?</div>
    <div class="starter" data-msg="How much are lessons?">Pricing</div>
    <div class="starter" data-msg="Can you check this sentence: She don't like coffee.">Check a sentence</div>
  </div>
  <div id="input-row">
    <input id="chat-input" type="text" placeholder="Type a question or a sentence..." />
    <button id="send-btn">Send</button>
  </div>
</div>

function buildSystemPrompt(lang){
  return `You are the assistant embedded on an English-teaching website. You have four jobs, and you switch between them naturally based on what the student sends:

1. SITE SUPPORT: answer questions about courses, levels (Beginner A1 to Advanced C1), scheduling, and how lessons work. If you don't know a specific detail, say the teacher will confirm it — don't invent numbers or facts.

2. SITE LINKS: if the student asks for site info, contact details, the blog/guide, or a specific program page, share the single most relevant link from this exact list (never invent a URL, never modify one):
- İletişim / Contact: https://www.apexenglish.net/iletisim
- İngilizce Rehberi (Blog): https://www.apexenglish.net/ingilizce-ogrenme-rehberi
- Genel İngilizce Programı: https://www.apexenglish.net/genel-ingilizce-program
- İş İngilizcesi Programı: https://www.apexenglish.net/-ngilizce-program
- Profesyonel Yönetici İngilizcesi: https://www.apexenglish.net/yonetici-ingilizcesi
- Konuşma Kulübü: https://www.apexenglish.net/speaking-club
- Sektörel İngilizce (Finans, Hukuk, IT vb.): https://www.apexenglish.net/sektre-zel-ngilizce
- Online Eğitimler: https://www.apexenglish.net/online-egitimler
- Kurumsal Eğitimler: https://www.apexenglish.net/kurumsal-egitimler
- Ücretsiz Seviye Testi: https://www.apexenglish.net/ucretsiz-seviye-analizi
- Kabin Memuru Mülakat Hazırlığı: https://www.apexenglish.net/kabin-memuru-mulakat-hazirlik
- Anasayfa: https://www.apexenglish.net/
Share the link as plain text in your reply. If nothing in the list matches what they asked, say you're not sure and suggest contacting the team instead of guessing a URL.

3. CONVERSATION PRACTICE: if the student writes a sentence or is clearly practicing English, respond warmly and naturally to what they said, AND check their grammar.
- STRICT RULE: only use the [WRONG]/[RIGHT] tags for a genuine grammatical mistake (wrong verb form, wrong tense, subject-verb agreement, wrong preposition, missing/extra word, spelling that changes meaning). Do NOT use them for word-choice preferences, more natural phrasing, formality level, or anything that is already grammatically correct — those are not errors.
- If you are not fully sure something is a real grammatical error, treat the sentence as correct and do not tag anything.
- When there is a real error, show it using this exact format inline: [WRONG]their original wrong phrase[/WRONG][RIGHT]the corrected phrase[/RIGHT]. Tag only the specific wrong words/phrase, not the whole sentence.
- If the sentence is grammatically correct, do NOT use [WRONG] or [RIGHT] anywhere in your reply — just say so briefly and keep the conversation going with a follow-up question.
- Example (error — tag it): student writes "She don't like coffee." → mention that [WRONG]she don't like[/WRONG][RIGHT]she doesn't like[/RIGHT] coffee, then continue naturally.
- Example (correct — no tags at all): student writes "I have been living here for two years." → this is fully correct, so respond with encouragement and a follow-up question only, with zero [WRONG]/[RIGHT] tags in the reply.

4. PRICING → NEVER STATE A NUMBER, ALWAYS COLLECT EMAIL INSTEAD: if the student asks about price, fees, or cost in any way, do NOT give any number or price range, not even a rough one. Instead, in ONE short sentence (max ~15 words), say the teacher will send the exact pricing, and ask for their email address. Do not explain why, do not add extra context or reassurance — just that one short sentence. Ask this only once per conversation — if they already gave an email earlier, don't ask again. If the student's message contains something that looks like a real email address (e.g. name@domain.com), thank them briefly (one short sentence), confirm the pricing table will be sent to that address, and include this exact hidden marker once anywhere in your reply: [EMAIL]their@address.com[/EMAIL] — put their actual detected email inside it. This marker is stripped out automatically before the student ever sees your message, so don't reference it or explain it to them.

IMPORTANT — LANGUAGE: the student's interface is set to ${UI[lang].langName}. Write ALL of your own explanations, greetings, and support answers in ${UI[lang].langName}. Example English sentences being taught or corrected stay in English (inside the [WRONG]/[RIGHT] tags), but everything else you say should be in ${UI[lang].langName}.

Keep replies short (2-4 sentences), warm, and encouraging — never condescending. Use plain language appropriate for English learners.`;
}

const messagesEl = document.getElementById('messages');
const input = document.getElementById('chat-input');
const sendBtn = document.getElementById('send-btn');
const launcherWrap = document.getElementById('launcher-wrap');
const launcher = document.getElementById('launcher');
const panel = document.getElementById('panel');
const closeBtn = document.getElementById('close-btn');
const starters = document.getElementById('starters');
const headerTitle = document.getElementById('header-title');
const headerSub = document.getElementById('header-sub');
const langButtons = document.querySelectorAll('.lang-btn');

let history = [];
let currentLang = 'en';

function applyLanguage(lang){
  currentLang = lang;
  const t = UI[lang];
  headerTitle.textContent = t.title;
  headerSub.textContent = t.sub;
  input.placeholder = t.placeholder;
  sendBtn.textContent = t.send;
  starters.innerHTML = '';
  t.starters.forEach(s => {
    const div = document.createElement('div');
    div.className = 'starter';
    if(s.msg){ div.dataset.msg = s.msg; }
    if(s.instant){ div.dataset.instant = '1'; }
    if(s.url){ div.dataset.url = s.url; }
    div.textContent = s.label;
    starters.appendChild(div);
  });
  langButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang));
}

langButtons.forEach(btn => {
  btn.addEventListener('click', () => applyLanguage(btn.dataset.lang));
});

launcher.addEventListener('click', () => {
  panel.classList.add('open');
  launcherWrap.classList.add('opened');
  if(history.length === 0){
    addBotMessage(UI[currentLang].greeting);
  }
});
closeBtn.addEventListener('click', () => panel.classList.remove('open'));

starters.addEventListener('click', (e) => {
  const url = e.target.dataset.url;
  if(url){
    window.open(url, '_blank', 'noopener');
    return;
  }
  const msg = e.target.dataset.msg;
  if(!msg) return;
  if(e.target.dataset.instant){
    addUserMessage(msg);
    history.push({ role: 'user', content: msg });
    const reply = UI[currentLang].priceReply;
    addBotMessage(reply);
    history.push({ role: 'assistant', content: reply });
    return;
  }
  input.value = msg;
  sendMessage();
});

// Looks for the hidden [EMAIL]...[/EMAIL] marker the model includes once it
// has collected a real email address from the student. Returns the reply
// text with the marker removed (never shown to the student) plus the
// captured address, if any.
function extractCapturedEmail(text){
  const match = text.match(/\[EMAIL\](.*?)\[\/EMAIL\]/i);
  if(!match){ return { cleaned: text, email: null }; }
  return { cleaned: text.replace(match[0], '').trim(), email: match[1].trim() };
}

// Fire-and-forget — this should never block or interrupt the student's chat.
function notifyOwner(visitorEmail, contextMessage){
  fetch('/api/notify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ visitorEmail, context: contextMessage, lang: currentLang })
  }).catch(() => {});
}

applyLanguage('tr');

// Auto-open the widget 30 seconds after the page loads, on every page.
// If the visitor already opened (or closed) it manually before then, don't
// pop it open on top of them.
let userHasToggled = false;
launcher.addEventListener('click', () => { userHasToggled = true; });
closeBtn.addEventListener('click', () => { userHasToggled = true; });

setTimeout(() => {
  if(!userHasToggled && !panel.classList.contains('open')){
    panel.classList.add('open');
    launcherWrap.classList.add('opened');
    if(history.length === 0){
      addBotMessage(UI[currentLang].greeting);
    }
  }
}, 30000);

function renderBotContent(text){
  const escaped = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return escaped
    .replace(/\[WRONG\](.*?)\[\/WRONG\]/g, '<span class="wrong">$1</span>')
    .replace(/\[RIGHT\](.*?)\[\/RIGHT\]/g, '<span class="right">$1</span>')
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:var(--marigold-deep);text-decoration:underline;">$1</a>');
}

function addUserMessage(text){
  const div = document.createElement('div');
  div.className = 'msg user';
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addBotMessage(text){
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = renderBotContent(text);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addTyping(){
  const div = document.createElement('div');
  div.className = 'msg typing';
  div.id = 'typing-indicator';
  div.textContent = UI[currentLang].typing;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function removeTyping(){
  const el = document.getElementById('typing-indicator');
  if(el) el.remove();
}

async function sendMessage(){
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  sendBtn.disabled = true;
  addUserMessage(text);
  history.push({ role: 'user', content: text });
  addTyping();

  try{
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        systemPrompt: buildSystemPrompt(currentLang),
        messages: history
      })
    });
    const data = await response.json();
    removeTyping();
    if(!response.ok){
      console.error('API error:', data.error);
      addBotMessage(UI[currentLang].error);
      return;
    }
    const { cleaned, email } = extractCapturedEmail(data.reply);
    addBotMessage(cleaned);
    history.push({ role: 'assistant', content: cleaned });
    if(email){
      notifyOwner(email, text);
    }
  }catch(err){
    removeTyping();
    addBotMessage(UI[currentLang].error);
    console.error(err);
  }finally{
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keydown', (e) => { if(e.key === 'Enter') sendMessage(); });
</script>

</body>
</html>
