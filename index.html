<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>English Site Assistant — Widget Demo</title>
<style>
  :root{
    --paper:#EFEDE6;
    --ink:#202A44;
    --ink-soft:#4A5570;
    --marigold:#E8B930;
    --marigold-deep:#C9971A;
    --correct:#3F7859;
    --line:#C9C2B4;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html, body{
    margin:0;
    font-family:'IBM Plex Sans', Arial, sans-serif;
    background:transparent;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
    width:100%;
  }
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Lora:ital,wght@0,500;0,600;1,500&display=swap');

  /* Launcher */
  #launcher-wrap{
    position:fixed;
    top:28px;
    right:28px;
    width:60px;
    height:60px;
    z-index:1000;
  }
  #launcher-wrap.opened #pulse-ring,
  #launcher-wrap.opened #pulse-ring-2{ display:none; }
  #launcher-wrap.opened #launcher{ animation:none; }
  #pulse-ring, #pulse-ring-2{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:var(--marigold);
    opacity:0.6;
    animation:pulse-ring 1.8s cubic-bezier(0.3,0,0.5,1) infinite;
    pointer-events:none;
  }
  #pulse-ring-2{
    animation-delay:0.9s;
  }
  @keyframes pulse-ring{
    0%{ transform:scale(1); opacity:0.6; }
    75%{ transform:scale(1.9); opacity:0; }
    100%{ transform:scale(1.9); opacity:0; }
  }
  #launcher{
    position:relative;
    width:60px;
    height:60px;
    border-radius:50%;
    background:var(--ink);
    border:none;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(32,42,68,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1;
    transition:transform 0.2s ease;
    animation:launcher-bounce 2.4s ease-in-out infinite;
  }
  @keyframes launcher-bounce{
    0%, 55%, 100%{ transform:translateY(0); }
    70%{ transform:translateY(-4px); }
    82%{ transform:translateY(0); }
  }
  #launcher:hover{ transform:scale(1.06); }
  #launcher svg{ width:27px; height:27px; }
  #launcher .bubble{
    fill:var(--marigold);
  }
  #launcher .dot{
    fill:var(--ink);
  }

  /* Panel */
  #panel{
    position:fixed;
    top:100px;
    right:28px;
    width:360px;
    max-width:calc(100vw - 40px);
    height:540px;
    max-height:calc(100vh - 140px);
    background:var(--white);
    border-radius:14px;
    box-shadow:0 20px 60px rgba(32,42,68,0.28);
    display:none;
    flex-direction:column;
    overflow:hidden;
    z-index:1000;
    border:1px solid var(--line);
  }
  #panel.open{ display:flex; }

  #panel header{
    background:var(--ink);
    color:var(--white);
    padding:16px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  #panel header .title{
    font-family:'Lora', serif;
    font-weight:600;
    font-size:1rem;
  }
  #panel header .sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    color:var(--marigold);
    margin-top:2px;
    letter-spacing:0.03em;
  }
  #close-btn{
    background:none;
    border:none;
    color:var(--white);
    font-size:1.1rem;
    cursor:pointer;
    opacity:0.7;
    line-height:1;
  }
  #close-btn:hover{ opacity:1; }

  #lang-switch{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
    padding:8px 16px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .lang-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.62rem;
    font-weight:600;
    letter-spacing:0.02em;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:100px;
    padding:4px 8px;
    cursor:pointer;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .lang-btn.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--marigold);
  }

  #messages{
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:12px;
    background:var(--paper);
  }
  .msg{
    max-width:84%;
    padding:10px 13px;
    border-radius:12px;
    font-size:0.88rem;
    line-height:1.5;
    white-space:pre-wrap;
  }
  .msg.user{
    align-self:flex-end;
    background:var(--marigold);
    color:var(--ink);
    border-bottom-right-radius:3px;
  }
  .msg.bot{
    align-self:flex-start;
    background:var(--white);
    color:var(--ink);
    border:1px solid var(--line);
    border-bottom-left-radius:3px;
  }
  .msg.bot .wrong{
    color:#A14444;
    text-decoration:line-through;
    text-decoration-thickness:1.5px;
    opacity:0.75;
  }
  .msg.bot .right{
    color:var(--correct);
    font-weight:600;
  }
  .msg.typing{
    align-self:flex-start;
    background:var(--white);
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
    font-size:0.78rem;
  }

  #input-row{
    display:flex;
    gap:8px;
    padding:12px;
    background:var(--white);
    border-top:1px solid var(--line);
  }
  #input-row input{
    flex:1;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:16px;
    outline:none;
    color:var(--ink);
  }
  #input-row input:focus{
    border-color:var(--marigold-deep);
  }
  #input-row button{
    background:var(--ink);
    color:var(--white);
    border:none;
    border-radius:8px;
    padding:0 16px;
    font-weight:600;
    font-size:0.85rem;
    cursor:pointer;
  }
  #input-row button:disabled{
    opacity:0.5;
    cursor:default;
  }

  .starter-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    padding:0 16px 12px;
    background:var(--paper);
    max-height: 90px;
    overflow-y: auto;
  }
  .starter{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:100px;
    padding:4px 9px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .starter:hover{ border-color:var(--marigold-deep); color:var(--ink); }
</style>
</head>

      <circle class="dot" cx="12" cy="11.4" r="1.15"/>
      <circle class="dot" cx="15.8" cy="11.4" r="1.15"/>
    </svg>
  </button>
</div>

<div id="panel">
  <header>
    <div>
      <div class="title" id="header-title">İngilizce pratiğine hazır mısın?</div>

    </div>
    <button id="close-btn" aria-label="Close">✕</button>
  </header>
  <div id="lang-switch">
    <button class="lang-btn active" data-lang="tr">TR</button>
    <button class="lang-btn" data-lang="en">EN</button>
    <button class="lang-btn" data-lang="ru">RU</button>
    <button class="lang-btn" data-lang="fa">FA</button>
    <button class="lang-btn" data-lang="es">ES</button>
    <button class="lang-btn" data-lang="fr">FR</button>
    <button class="lang-btn" data-lang="zh">ZH</button>
    <button class="lang-btn" data-lang="ja">JA</button>
  </div>
  <div id="messages"></div>
  <div class="starter-row" id="starters"></div>
  <div id="input-row">
    <input id="chat-input" type="text" placeholder="Type a question or a sentence..." />
    <button id="send-btn">Send</button>
  </div>
</div>

function buildSystemPrompt(lang){
  return `You are the AI assistant embedded on Apex English (apexenglish.net). You have 5 primary duties and switch between them seamlessly:

1. AI MIKRO TOOLS (Email Polisher, Tone Converter, Interview Assistant, Resume Optimizer):
- If the user asks to fix/polish an email or convert text to corporate tone: Provide a refined, professional, and grammatically flawless Business English version. Show clear improvements.
- If the user provides an interview answer: Rephrase it using strong action verbs, professional structure, and the STAR framework where applicable.
- If the user wants to convert casual phrasing to executive language: Provide high-level corporate equivalents (e.g., C1/C2 vocabulary).
- Lead Gen Lead-in: After providing a micro-tool response, end with a brief invitation like: "To measure your complete Business English accuracy, try our free level test here: https://www.apexenglish.net/ucretsiz-seviye-analizi"

2. SITE SUPPORT: Answer questions about courses, levels (Beginner A1 to Advanced C1), scheduling, and how lessons work. If you don't know a specific detail, say the teacher will confirm it — don't invent numbers or facts.

3. SITE LINKS: If requested, share the single most relevant official URL from this exact list:
- İletişim / Contact: https://www.apexenglish.net/iletisim
- İngilizce Rehberi (Blog): https://www.apexenglish.net/ingilizce-ogrenme-rehberi
- Genel İngilizce Programı: https://www.apexenglish.net/genel-ingilizce-program
- İş İngilizcesi Programı: https://www.apexenglish.net/-ngilizce-program
- Profesyonel Yönetici İngilizcesi: https://www.apexenglish.net/yonetici-ingilizcesi
- Konuşma Kulübü: https://www.apexenglish.net/speaking-club
- Sektörel İngilizce (Finans, Hukuk, IT vb.): https://www.apexenglish.net/sektre-zel-ngilizce
- Online Eğitimler: https://www.apexenglish.net/online-egitimler
- Kurumsal Eğitimler: https://www.apexenglish.net/kurumsal-egitimler
- Ücretsiz Seviye Testi: https://www.apexenglish.net/ucretsiz-seviye-analizi
- Kabin Memuru Mülakat Hazırlığı: https://www.apexenglish.net/kabin-memuru-mulakat-hazirlik
- Anasayfa: https://www.apexenglish.net/

4. CONVERSATION & GRAMMAR PRACTICE: If the student writes a sentence to practice, respond naturally AND check grammar.
- STRICT RULE: Only use [WRONG]wrong phrase[/WRONG][RIGHT]corrected phrase[/RIGHT] tags for real grammatical errors (verb tenses, prepositions, spelling errors).
- Do NOT tag correct sentences. If correct, complement them and keep the conversation going.

5. PRICING → NEVER STATE A NUMBER, ALWAYS COLLECT EMAIL INSTEAD:
- If asked about fees/price, do NOT give numbers.
- Say in 1 short sentence that the team will send the exact pricing, and ask for their email address.
- When an email is detected (e.g. user@domain.com), thank them and include hidden tag: [EMAIL]user@domain.com[/EMAIL]

IMPORTANT — LANGUAGE:
The user's interface language is ${UI[lang].langName}. Write all explanations and support messages in ${UI[lang].langName}. Example English sentences or corrected English outputs inside tags stay in English.

Keep replies concise, clear, encouraging, and professional.`;
}

const messagesEl = document.getElementById('messages');
const input = document.getElementById('chat-input');
const sendBtn = document.getElementById('send-btn');
const launcherWrap = document.getElementById('launcher-wrap');
const launcher = document.getElementById('launcher');
const panel = document.getElementById('panel');
const closeBtn = document.getElementById('close-btn');
const starters = document.getElementById('starters');
const headerTitle = document.getElementById('header-title');
const headerSub = document.getElementById('header-sub');
const langButtons = document.querySelectorAll('.lang-btn');

let history = [];
let currentLang = 'tr';

function applyLanguage(lang){
  currentLang = lang;
  const t = UI[lang];
  headerTitle.textContent = t.title;
  headerSub.textContent = t.sub;
  input.placeholder = t.placeholder;
  sendBtn.textContent = t.send;
  starters.innerHTML = '';
  t.starters.forEach(s => {
    const div = document.createElement('div');
    div.className = 'starter';
    if(s.msg){ div.dataset.msg = s.msg; }
    if(s.instant){ div.dataset.instant = '1'; }
    if(s.url){ div.dataset.url = s.url; }
    div.textContent = s.label;
    starters.appendChild(div);
  });
  langButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.lang === lang));
}

langButtons.forEach(btn => {
  btn.addEventListener('click', () => applyLanguage(btn.dataset.lang));
});

launcher.addEventListener('click', () => {
  panel.classList.add('open');
  launcherWrap.classList.add('opened');
  if(history.length === 0){
    addBotMessage(UI[currentLang].greeting);
  }
});
closeBtn.addEventListener('click', () => panel.classList.remove('open'));

starters.addEventListener('click', (e) => {
  const url = e.target.dataset.url;
  if(url){
    window.open(url, '_blank', 'noopener');
    return;
  }
  const msg = e.target.dataset.msg;
  if(!msg) return;
  if(e.target.dataset.instant){
    addUserMessage(msg);
    history.push({ role: 'user', content: msg });
    const reply = UI[currentLang].priceReply;
    addBotMessage(reply);
    history.push({ role: 'assistant', content: reply });
    return;
  }
  input.value = msg;
  sendMessage();
});

function extractCapturedEmail(text){
  const match = text.match(/\[EMAIL\](.*?)\[\/EMAIL\]/i);
  if(!match){ return { cleaned: text, email: null }; }
  return { cleaned: text.replace(match[0], '').trim(), email: match[1].trim() };
}

function notifyOwner(visitorEmail, contextMessage){
  fetch('/api/notify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ visitorEmail, context: contextMessage, lang: currentLang })
  }).catch(() => {});
}

applyLanguage('tr');

let userHasToggled = false;
launcher.addEventListener('click', () => { userHasToggled = true; });
closeBtn.addEventListener('click', () => { userHasToggled = true; });

setTimeout(() => {
  if(!userHasToggled && !panel.classList.contains('open')){
    panel.classList.add('open');
    launcherWrap.classList.add('opened');
    if(history.length === 0){
      addBotMessage(UI[currentLang].greeting);
    }
  }
}, 30000);

function renderBotContent(text){
  const escaped = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return escaped
    .replace(/\[WRONG\](.*?)\[\/WRONG\]/g, '<span class="wrong">$1</span>')
    .replace(/\[RIGHT\](.*?)\[\/RIGHT\]/g, '<span class="right">$1</span>')
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:var(--marigold-deep);text-decoration:underline;">$1</a>');
}

function addUserMessage(text){
  const div = document.createElement('div');
  div.className = 'msg user';
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addBotMessage(text){
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = renderBotContent(text);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addTyping(){
  const div = document.createElement('div');
  div.className = 'msg typing';
  div.id = 'typing-indicator';
  div.textContent = UI[currentLang].typing;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function removeTyping(){
  const el = document.getElementById('typing-indicator');
  if(el) el.remove();
}

async function sendMessage(){
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  sendBtn.disabled = true;
  addUserMessage(text);
  history.push({ role: 'user', content: text });
  addTyping();

  try{
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        systemPrompt: buildSystemPrompt(currentLang),
        messages: history
      })
    });
    const data = await response.json();
    removeTyping();
    if(!response.ok){
      console.error('API error:', data.error);
      addBotMessage(UI[currentLang].error);
      return;
    }
    const { cleaned, email } = extractCapturedEmail(data.reply);
    addBotMessage(cleaned);
    history.push({ role: 'assistant', content: cleaned });
    if(email){
      notifyOwner(email, text);
    }
  }catch(err){
    removeTyping();
    addBotMessage(UI[currentLang].error);
    console.error(err);
  }finally{
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keydown', (e) => { if(e.key === 'Enter') sendMessage(); });
</script>

</body>
</html>
