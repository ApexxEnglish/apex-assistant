<html lang="en">
<head>
<meta charset="UTF-8">

<title>English Site Assistant — Widget Demo</title>
<style>
  #mode-toolbar{
  display:none;
  padding:8px 12px 0;
  background:var(--white);
  border-top:1px solid var(--line);
}

#mode-toolbar.visible{
  display:flex;
}

#change-mode-btn{
  background:transparent;
  border:none;
  padding:4px 2px;
  color:var(--ink-soft);
  font-family:'IBM Plex Mono', monospace;
  font-size:0.68rem;
  font-weight:600;
  cursor:pointer;
}

#change-mode-btn:hover{
  color:var(--ink);
}
  :root{
    --paper:#EFEDE6;
    --ink:#202A44;
    --ink-soft:#4A5570;
    --marigold:#E8B930;
    --marigold-deep:#C9971A;
    --correct:#3F7859;
    --line:#C9C2B4;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html, body{
    margin:0;
    font-family:'IBM Plex Sans', Arial, sans-serif;
    background:transparent;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
    width:100%;
  }
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Lora:ital,wght@0,500;0,600;1,500&display=swap');

  /* Launcher */
  #launcher-wrap{
    position:fixed;
    top:28px;
    right:28px;
    width:60px;
    height:60px;
    z-index:1000;
  }
  #launcher-wrap.opened #pulse-ring,
  #launcher-wrap.opened #pulse-ring-2{ display:none; }
  #launcher-wrap.opened #launcher{ animation:none; }
  #pulse-ring, #pulse-ring-2{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:var(--marigold);
    opacity:0.6;
    animation:pulse-ring 1.8s cubic-bezier(0.3,0,0.5,1) infinite;
    pointer-events:none;
  }
  #pulse-ring-2{
    animation-delay:0.9s;
  }
  @keyframes pulse-ring{
    0%{ transform:scale(1); opacity:0.6; }
    75%{ transform:scale(1.9); opacity:0; }
    100%{ transform:scale(1.9); opacity:0; }
  }
  #launcher{
    position:relative;
    width:60px;
    height:60px;
    border-radius:50%;
    background:var(--ink);
    border:none;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(32,42,68,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1;
    transition:transform 0.2s ease;
    animation:launcher-bounce 2.4s ease-in-out infinite;
  }
  @keyframes launcher-bounce{
    0%, 55%, 100%{ transform:translateY(0); }
    70%{ transform:translateY(-4px); }
    82%{ transform:translateY(0); }
  }
  #launcher:hover{ transform:scale(1.06); }
  #launcher svg{ width:27px; height:27px; }
  #launcher .bubble{
    fill:var(--marigold);
  }
  #launcher .dot{
    fill:var(--ink);
  }

  /* Panel */
  #panel{
    position: fixed;
top: 100px;
right: 28px;

width: 520px;
max-width: calc(100vw - 40px);

height: 620px;
max-height: calc(100vh - 140px);

background: var(--white);
border-radius: 14px;
box-shadow: 0 20px 60px rgba(32,42,68,0.28);

display: none;
flex-direction: column;
overflow: hidden;

z-index: 1000;
border: 1px solid var(--line);
  }
  #panel.open{ display:flex; }

  #panel header{
    background:var(--ink);
    color:var(--white);
    padding:16px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  #panel header .title{
    font-family:'Lora', serif;
    font-weight:600;
    font-size:1rem;
  }
  #panel header .sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    color:var(--marigold);
    margin-top:2px;
    letter-spacing:0.03em;
  }
  #close-btn{
    background:none;
    border:none;
    color:var(--white);
    font-size:1.1rem;
    cursor:pointer;
    opacity:0.7;
    line-height:1;
  }
  #close-btn:hover{ opacity:1; }

  #lang-switch{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
    padding:8px 16px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .lang-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.62rem;
    font-weight:600;
    letter-spacing:0.02em;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:100px;
    padding:4px 8px;
    cursor:pointer;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .lang-btn.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--marigold);
  }

  #messages{
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:12px;
    background:var(--paper);
  }
  .msg{
    max-width:90%;
    padding:10px 13px;
    border-radius:12px;
    font-size:0.88rem;
    line-height:1.5;
    white-space:pre-wrap;
  }
  .msg.user{
    align-self:flex-end;
    background:var(--marigold);
    color:var(--ink);
    border-bottom-right-radius:3px;
  }
  .msg.bot{
    align-self:flex-start;
    background:var(--white);
    color:var(--ink);
    border:1px solid var(--line);
    border-bottom-left-radius:3px;
  }
  .msg.bot .wrong{
    color:#A14444;
    text-decoration:line-through;
    text-decoration-thickness:1.5px;
    opacity:0.75;
  }
  .msg.bot .right{
    color:var(--correct);
    font-weight:600;
  }
  .msg.typing{
    align-self:flex-start;
    background:var(--white);
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
    font-size:0.78rem;
  }

  #input-row{
    display:flex;
    gap:8px;
    padding:12px;
    background:var(--white);
    border-top:1px solid var(--line);
  }
  #input-row input{
    flex:1;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:16px;
    outline:none;
    color:var(--ink);
  }
  #input-row input:focus{
    border-color:var(--marigold-deep);
  }
  #input-row button{
    background:var(--ink);
    color:var(--white);
    border:none;
    border-radius:8px;
    padding:0 16px;
    font-weight:600;
    font-size:0.85rem;
    cursor:pointer;
  }
  #input-row button:disabled{
    opacity:0.5;
    cursor:default;
  }

  #mic-btn{
    width:44px;
    min-width:44px;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1rem;
    background:var(--white);
    color:var(--ink);
    border:1px solid var(--line);
    position:relative;
  }

  #mic-btn:hover{
    border-color:var(--marigold-deep);
  }

  #mic-btn.listening{
    background:var(--marigold);
    border-color:var(--marigold-deep);
    color:var(--ink);
    animation:mic-pulse 1.15s ease-in-out infinite;
  }

  @keyframes mic-pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.06); }
  }

  #mic-btn .mic-stop{
    display:none;
    font-size:0.8rem;
  }

  #mic-btn.listening .mic-icon{
    display:none;
  }

  #mic-btn.listening .mic-stop{
    display:inline;
  }

  .starter-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    padding:0 16px 12px;
    background:var(--paper);
    max-height:95px;
    overflow-y:auto;
  }
  .starter{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:100px;
    padding:4px 9px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .starter:hover{ border-color:var(--marigold-deep); color:var(--ink); }
</style>
</head>

    <button id="close-btn" aria-label="Close">✕</button>
  </header>
  <div id="lang-switch">
    <button class="lang-btn active" data-lang="tr">TR</button>

  <div id="messages"></div>
  <div class="starter-row" id="starters"></div>
  <div id="mode-toolbar">
  <button id="change-mode-btn" type="button">
    ↩ Change Mode
  </button>
</div>
  <div id="input-row">

    <button id="mic-btn" type="button" aria-label="Start speaking" title="Start speaking">

    </button>
    <button id="send-btn">Send</button>
  </div>
</div>

function buildSystemPrompt(lang){
  const level = session.level || "unknown";
  const mode = session.mode || "general";
  const topic = session.topic || "not selected";

  return `
You are Apex Assistant, the AI English coach embedded on Apex English
(https://www.apexenglish.net).

USER SESSION:
- Interface language: ${UI[lang].langName}
- English level: ${level}
- Current learning mode: ${mode}
- Current topic: ${topic}
- Voice input active: ${session.voiceMode ? "yes" : "no"}

Your goal is not only to answer questions. You should actively help the
student improve their English according to their level.

==================================================
1. LEVEL ADAPTATION
==================================================

Always adapt English examples, explanations and questions to the user's
English level.

A1-A2:
- Use short sentences.
- Use common vocabulary.
- Explain grammar simply.
- Give one challenge at a time.

B1:
- Use natural everyday English.
- Introduce useful intermediate vocabulary.
- Keep explanations concise.

B2:
- Use more natural and professional English.
- Introduce collocations and alternative expressions.

C1:
- Use advanced, natural English.
- Explain nuance, register and style when useful.

If the level is "unknown", do NOT pretend to know it.
Help the student determine it through a short diagnostic conversation.

==================================================
2. LEVEL DIAGNOSTIC MODE
==================================================

When mode is "level_check":
- Estimate the student's CEFR level from A1, A2, B1, B2, or C1.
- Ask ONE short English question at a time.
- Start easy and increase difficulty gradually.
- Use a maximum of 4 student answers.
- When you have enough evidence, briefly explain the estimated level in ${UI[lang].langName}.
- At the very end, include exactly one marker:
  [LEVEL:A1] or [LEVEL:A2] or [LEVEL:B1] or [LEVEL:B2] or [LEVEL:C1]
- Do not use a level marker before you are ready to decide.

==================================================
3. SENTENCE CORRECTION / COACH MODE
==================================================

When mode is "correction":

If the student has not provided an English sentence yet, ask them in
${UI[lang].langName} to write the sentence they want corrected.

When they provide a sentence, ALWAYS structure the response like this:

YOUR SENTENCE:
Repeat the student's original sentence.

CORRECTED VERSION:
Write ONLY the final corrected English sentence.
Do not repeat the incorrect sentence here.
Do not show both the wrong and corrected versions on the same line.
Do not add markdown bold markers around the correction.

WHY:
Explain only the main error(s) briefly in ${UI[lang].langName}.
Use a maximum of 2-3 short sentences unless the student asks for more detail.
MORE NATURAL:
Give one more natural English alternative.

TRY IT YOURSELF:
Give ONE short sentence in ${UI[lang].langName} for the student to translate
or rewrite in English.

Use:
[WRONG]wrong text[/WRONG]
[RIGHT]correct text[/RIGHT]

only when there is a genuine mistake.

If the original sentence is already correct, say clearly that it is correct.
Do not invent mistakes.

==================================================
4. TEACH ME MODE
==================================================

When mode is "teach":

Teach according to:
- the user's level: ${level}
- the selected topic: ${topic}

Do not give a long lecture.

Use this teaching sequence:

1. Short explanation
2. 2-3 English examples
3. One useful tip
4. Ask the student ONE practice question

Topics may include:
- Grammar
- Vocabulary
- Idioms
- Everyday English
- Business English

If the topic has not been selected yet, ask what they want to learn.

==================================================
5. PRACTICE WITH ME MODE
==================================================

When mode is "practice":

Act as a conversation partner or role-play partner.

Adapt difficulty to ${level}.

Ask ONE question at a time.

After the student answers:
1. Briefly react to the meaning.
2. Correct important English mistakes.
3. Give a more natural alternative when useful.
4. Continue the conversation with ONE next question.

Do not interrupt every sentence for tiny stylistic issues.

Possible practice topics:
- Everyday conversation
- Business English
- Job interview
- Travel English
- Free conversation

==================================================
6. BUSINESS ENGLISH
==================================================

For Business English help, support:
- professional emails
- meetings
- presentations
- phone/video calls
- negotiations
- job interviews
- workplace vocabulary

When correcting professional English, if useful provide:
- Correct version
- More professional version
- More natural version

Do not make English unnecessarily formal.

==================================================
7. INTERVIEW PREPARATION
==================================================

When the student wants interview preparation:

Step 1:
Ask in ${UI[lang].langName} which company and position they are interviewing for.

Step 2:
Ask ONE realistic interview question at a time in English.

Step 3:
After every answer:
- Correct important grammar/vocabulary errors.
- Give a brief evaluation.
- Provide an improved sample answer appropriate to ${level}.
- Ask ONE next interview question.

==================================================
8. VOICE / SPEAKING COACH
==================================================

When Voice input active is "yes", treat the user's message as a transcript of spoken English.

- Do NOT claim to evaluate pronunciation, accent, stress, or individual sounds from transcript text alone.
- Focus on grammar, vocabulary, clarity, fluency-friendly phrasing, and natural spoken English.
- Briefly react to what the student meant.
- Correct only important mistakes.
- Give one more natural spoken alternative when useful.
- Keep feedback concise so the exchange feels like a real conversation.
- End with ONE next question in English when the user is in practice or interview mode.

==================================================
9. COURSE / APEX SUPPORT
==================================================

You may answer questions about Apex English programs.

Use ONLY these official URLs:

İletişim:
https://www.apexenglish.net/iletisim

İngilizce Öğrenme Rehberi:
https://www.apexenglish.net/ingilizce-ogrenme-rehberi

Genel İngilizce:
https://www.apexenglish.net/genel-ingilizce-program

İş İngilizcesi:
https://www.apexenglish.net/is-ingilizcesi

Yönetici İngilizcesi:
https://www.apexenglish.net/yonetici-ingilizcesi

Konuşma Kulübü:
https://www.apexenglish.net/speaking-club

Sektöre Özel İngilizce:
https://www.apexenglish.net/sektore-ozel-ingilizce

Online Eğitimler:
https://www.apexenglish.net/online-egitimler

Kurumsal Eğitimler:
https://www.apexenglish.net/kurumsal-egitimler

Ücretsiz Seviye Analizi:
https://www.apexenglish.net/ucretsiz-seviye-analizi

İngilizce Mülakat Hazırlığı:
https://www.apexenglish.net/kabin-memuru-mulakat-hazirlik

AI İngilizce Asistanı:
https://www.apexenglish.net/ingilizce-asistan

Anasayfa:
https://www.apexenglish.net/

Do not invent URLs.

==================================================
10. COMMERCIAL INTENT / LEAD COLLECTION
==================================================

Do NOT ask for contact information during normal English practice.

Only move toward lead collection if the user shows clear commercial intent,
for example:
- asks for lesson prices
- asks about enrollment
- asks about private lessons
- asks about corporate training
- asks to speak with a teacher/advisor
- clearly wants to purchase a course

PRICING RULE:
NEVER invent or provide prices.

Say briefly that the Apex team can provide current pricing and ask for
their email address.

When the visitor provides an email address, include:

[EMAIL]name@domain.com[/EMAIL]

Do not show this marker as normal conversational text.

==================================================
11. GENERAL BEHAVIOR
==================================================

Write explanations and instructions in ${UI[lang].langName}.

English examples and practice questions should remain in English.

Be warm, concise and teacher-like.

Prefer interaction over lectures.

Ask one question at a time.

Do not repeatedly advertise Apex courses.

Your primary role is to help the user learn English.
`;
}

const messagesEl = document.getElementById('messages');
const input = document.getElementById('chat-input');
const sendBtn = document.getElementById('send-btn');
const launcherWrap = document.getElementById('launcher-wrap');
const launcher = document.getElementById('launcher');
const panel = document.getElementById('panel');
const closeBtn = document.getElementById('close-btn');
const starters = document.getElementById('starters');
const headerTitle = document.getElementById('header-title');
const headerSub = document.getElementById('header-sub');
const modeToolbar = document.getElementById('mode-toolbar');
const changeModeBtn = document.getElementById('change-mode-btn');
const micBtn = document.getElementById('mic-btn');
const langButtons = document.querySelectorAll('.lang-btn');

let history = [];
let currentLang = 'tr';

let session = {
  level: null,
  mode: null,
  topic: null,
  phase: "level",
  voiceMode: false
};

let voiceConversationActive = false;
let isListening = false;
let recognition = null;

function applyLanguage(lang){
  currentLang = lang;
  const t = UI[lang];
  const f = FLOW_UI[lang] || FLOW_UI.en;

  headerTitle.textContent = t.title;
  headerSub.textContent = t.sub;
  input.placeholder = t.placeholder;
  sendBtn.textContent = t.send;
  changeModeBtn.textContent = f.changeMode;
  micBtn.setAttribute('aria-label', isListening ? f.micStop : f.micStart);
  micBtn.title = isListening ? f.micStop : f.micStart;

  const firstBotMessage = messagesEl.querySelector('.msg.bot');
  if(firstBotMessage && history.length === 0){
    firstBotMessage.innerHTML = renderBotContent(t.greeting);
  }

  langButtons.forEach(btn =>
    btn.classList.toggle('active', btn.dataset.lang === lang)
  );

  renderCurrentChoices();
}

function clearStarters(){
  starters.innerHTML = '';
}

function addChoice(label, data = {}){
  const div = document.createElement('div');
  div.className = 'starter';

  Object.entries(data).forEach(([key, value]) => {
    div.dataset[key] = value;
  });

  div.textContent = label;
  starters.appendChild(div);
}

function addChoiceLabel(text){
  const label = document.createElement('div');
  label.style.width = '100%';
  label.style.fontSize = '0.72rem';
  label.style.fontWeight = '600';
  label.style.color = 'var(--ink-soft)';
  label.style.marginBottom = '3px';
  label.textContent = text;
  starters.appendChild(label);
}

function showLevelSelection(){
  session.phase = 'level';
  modeToolbar.classList.remove('visible');
  clearStarters();

  const f = FLOW_UI[currentLang] || FLOW_UI.en;
  addChoiceLabel(f.chooseLevel);

  ['A1','A2','B1','B2','C1'].forEach(level => {
    addChoice(level, { level });
  });

  addChoice(f.unknownLevel, { level: 'unknown' });
}

function showModeSelection(){
  modeToolbar.classList.add('visible');
  session.phase = 'mode';
  clearStarters();

  const f = FLOW_UI[currentLang] || FLOW_UI.en;
  addChoiceLabel(f.chooseMode);

  addChoice(f.correction, { mode: 'correction' });
  addChoice(f.teach, { mode: 'teach' });
  addChoice(f.practice, { mode: 'practice' });

  const priceStarter = UI[currentLang].starters.find(s => s.instant);
  addChoice(f.pricing, {
    instant: '1',
    msg: priceStarter ? priceStarter.msg : 'How much are lessons?'
  });

  addChoice(f.levelTest, {
    msg: f.levelTestMsg
  });
}

function showTeachTopics(){
  session.phase = 'topic';
  clearStarters();

  const f = FLOW_UI[currentLang] || FLOW_UI.en;
  addChoiceLabel(f.chooseTeachTopic);

  [
    [f.grammar, 'Grammar'],
    [f.vocabulary, 'Vocabulary'],
    [f.idioms, 'Idioms'],
    [f.everydayEnglish, 'Everyday English'],
    [f.businessEnglish, 'Business English']
  ].forEach(([label, topic]) => addChoice(label, { topic }));
}

function showPracticeTopics(){
  session.phase = 'topic';
  clearStarters();

  const f = FLOW_UI[currentLang] || FLOW_UI.en;
  addChoiceLabel(f.choosePracticeTopic);

  [
    [f.everydayConversation, 'Everyday conversation'],
    [f.businessEnglish, 'Business English'],
    [f.jobInterview, 'Job interview'],
    [f.travelEnglish, 'Travel English'],
    [f.freeConversation, 'Free conversation']
  ].forEach(([label, topic]) => addChoice(label, { topic }));
}

function renderCurrentChoices(){
  if(!session.level || session.phase === 'level'){
    showLevelSelection();
    return;
  }

  if(session.phase === 'mode'){
    showModeSelection();
    return;
  }

  if(session.mode === 'teach' && session.phase === 'topic'){
    showTeachTopics();
    return;
  }

  if(session.mode === 'practice' && session.phase === 'topic'){
    showPracticeTopics();
    return;
  }

  clearStarters();
}

langButtons.forEach(btn => {
  
  btn.addEventListener('click', () => applyLanguage(btn.dataset.lang));
});

launcher.addEventListener('click', () => {
  panel.classList.add('open');
  launcherWrap.classList.add('opened');
  if(history.length === 0){
    addBotMessage(UI[currentLang].greeting);
    setTimeout(showLevelSelection, 250);
  }
});
closeBtn.addEventListener('click', () => {
  stopVoiceRecognition();
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  panel.classList.remove('open');
});

starters.addEventListener('click', (e) => {
  const target = e.target.closest('.starter');
  if(!target) return;

  const f = FLOW_UI[currentLang] || FLOW_UI.en;

  const selectedLevel = target.dataset.level;
  if(selectedLevel){
    if(selectedLevel === 'unknown'){
      session.level = 'unknown';
      session.mode = 'level_check';
      session.topic = null;
      session.phase = 'diagnostic';

      addUserMessage(f.levelUnknownUser);
      history.push({ role: 'user', content: f.levelUnknownUser });

      clearStarters();
      input.value = f.levelCheckPrompt;
      sendMessage();
      return;
    }

    session.level = selectedLevel;
    session.mode = null;
    session.topic = null;
    session.phase = 'mode';

    addUserMessage(f.levelSelectedUser(selectedLevel));
    addBotMessage(f.levelSelectedBot(selectedLevel));

    showModeSelection();
    return;
  }

  const selectedMode = target.dataset.mode;
  if(selectedMode){
    session.mode = selectedMode;
    session.topic = null;

    if(selectedMode === 'correction'){
      session.phase = 'active';
      clearStarters();
      addUserMessage(f.correctionUser);
      addBotMessage(f.correctionBot);
      input.focus();
      return;
    }

    if(selectedMode === 'teach'){
      session.phase = 'topic';
      addUserMessage(f.teachUser);
      addBotMessage(f.teachBot);
      showTeachTopics();
      return;
    }

    if(selectedMode === 'practice'){
      session.phase = 'topic';
      addUserMessage(f.practiceUser);
      addBotMessage(f.practiceBot);
      showPracticeTopics();
      return;
    }
  }

  const selectedTopic = target.dataset.topic;
  if(selectedTopic){
    session.topic = selectedTopic;
    session.phase = 'active';

    addUserMessage(target.textContent.trim());
    clearStarters();

    input.value = session.mode === 'teach'
      ? f.teachPrompt(selectedTopic)
      : f.practicePrompt(selectedTopic);

    sendMessage();
    return;
  }

  const url = target.dataset.url;
  if(url){
    window.open(url, '_blank', 'noopener');
    return;
  }

  const msg = target.dataset.msg;
  if(!msg) return;

  if(target.dataset.instant){
    addUserMessage(msg);
    history.push({ role: 'user', content: msg });

    const reply = UI[currentLang].priceReply;
    addBotMessage(reply);
    history.push({ role: 'assistant', content: reply });
    return;
  }

  input.value = msg;
  sendMessage();
});


function getSpeechRecognitionConstructor(){
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}

function getRecognitionLanguage(){
  // English is intentional: the microphone is for English speaking practice.
  return 'en-US';
}

function setMicListeningState(listening){
  isListening = listening;
  const f = FLOW_UI[currentLang] || FLOW_UI.en;

  micBtn.classList.toggle('listening', listening);
  micBtn.setAttribute('aria-pressed', listening ? 'true' : 'false');
  micBtn.setAttribute('aria-label', listening ? f.micStop : f.micStart);
  micBtn.title = listening ? f.micStop : f.micStart;
}

function stripForSpeech(text){
  return text
    .replace(/\[WRONG\](.*?)\[\/WRONG\]/gi, '$1')
    .replace(/\[RIGHT\](.*?)\[\/RIGHT\]/gi, '$1')
    .replace(/\*\*(.*?)\*\*/g, '$1')
    .replace(/https?:\/\/\S+/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function speakBotReply(text){
  if(!voiceConversationActive) return;
  if(!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') return;

  const cleanText = stripForSpeech(text);
  if(!cleanText) return;

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(cleanText);
  utterance.lang = 'en-US';
  utterance.rate = 0.96;
  utterance.pitch = 1;

  window.speechSynthesis.speak(utterance);
}

function stopVoiceRecognition(){
  if(recognition && isListening){
    try{ recognition.stop(); }catch(e){}
  }
  setMicListeningState(false);
}

function startVoiceRecognition(){
  const Recognition = getSpeechRecognitionConstructor();
  const f = FLOW_UI[currentLang] || FLOW_UI.en;

  if(!Recognition){
    addBotMessage(f.voiceUnsupported);
    return;
  }

  if(isListening){
    stopVoiceRecognition();
    return;
  }

  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
  }

  recognition = new Recognition();
  recognition.lang = getRecognitionLanguage();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  let finalTranscript = '';
  let hadResult = false;

  recognition.onstart = () => {
    setMicListeningState(true);
    voiceConversationActive = true;
  };

  recognition.onresult = (event) => {
    hadResult = true;
    let interimTranscript = '';

    for(let i = event.resultIndex; i < event.results.length; i++){
      const transcript = event.results[i][0].transcript;

      if(event.results[i].isFinal){
        finalTranscript += transcript;
      }else{
        interimTranscript += transcript;
      }
    }

    input.value = (finalTranscript || interimTranscript).trim();
  };

  recognition.onerror = (event) => {
    setMicListeningState(false);

    if(event.error === 'not-allowed' || event.error === 'service-not-allowed'){
      addBotMessage(f.voicePermission);
      return;
    }

    if(event.error === 'no-speech'){
      addBotMessage(f.voiceNoSpeech);
      return;
    }

    if(event.error !== 'aborted'){
      addBotMessage(f.voiceError);
    }
  };

  recognition.onend = () => {
    setMicListeningState(false);

    const transcript = input.value.trim();

    if(finalTranscript.trim()){
      input.value = finalTranscript.trim();
      session.voiceMode = true;
      voiceConversationActive = true;
      sendMessage({ preserveVoiceMode: true });
      return;
    }

    if(!hadResult && !transcript){
      return;
    }
  };

  try{
    recognition.start();
  }catch(err){
    setMicListeningState(false);
    addBotMessage(f.voiceError);
  }
}

micBtn.addEventListener('click', startVoiceRecognition);

function extractCapturedEmail(text){
  const match = text.match(/\[EMAIL\](.*?)\[\/EMAIL\]/i);
  if(!match){ return { cleaned: text, email: null }; }
  return { cleaned: text.replace(match[0], '').trim(), email: match[1].trim() };
}

function extractEstimatedLevel(text){
  const match = text.match(/\[LEVEL:(A1|A2|B1|B2|C1)\]/i);
  if(!match){
    return { cleaned: text, level: null };
  }

  return {
    cleaned: text.replace(match[0], '').trim(),
    level: match[1].toUpperCase()
  };
}

function notifyOwner(visitorEmail, contextMessage){
  fetch('/api/notify', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ visitorEmail, context: contextMessage, lang: currentLang })
  }).catch(() => {});
}

applyLanguage('tr');

let userHasToggled = false;
launcher.addEventListener('click', () => { userHasToggled = true; });
closeBtn.addEventListener('click', () => { userHasToggled = true; });

setTimeout(() => {
  if(!userHasToggled && !panel.classList.contains('open')){
    panel.classList.add('open');
    launcherWrap.classList.add('opened');
    if(history.length === 0){
      addBotMessage(UI[currentLang].greeting);
      setTimeout(showLevelSelection, 250);
    }
  }
}, 30000);

function renderBotContent(text){
  const escaped = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return escaped
    .replace(/\[WRONG\](.*?)\[\/WRONG\]/g, '<span class="wrong">$1</span>')
    .replace(/\[RIGHT\](.*?)\[\/RIGHT\]/g, '<span class="right">$1</span>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:var(--marigold-deep);text-decoration:underline;">$1</a>');
}

function addUserMessage(text){
  const div = document.createElement('div');
  div.className = 'msg user';
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addBotMessage(text){
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = renderBotContent(text);

  messagesEl.appendChild(div);

  // AI cevabı geldiğinde cevabın SONUNA değil,
  // İLK SATIRINA getir.
  requestAnimationFrame(() => {
    const targetTop = div.offsetTop - messagesEl.offsetTop - 12;

    messagesEl.scrollTo({
      top: Math.max(0, targetTop),
      behavior: 'smooth'
    });
  });
}

function addTyping(){
  const div = document.createElement('div');
  div.className = 'msg typing';
  div.id = 'typing-indicator';
  div.textContent = UI[currentLang].typing;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function removeTyping(){
  const el = document.getElementById('typing-indicator');
  if(el) el.remove();
}

async function sendMessage(options = {}){
  const text = input.value.trim();
  if(!text) return;

  if(!options.preserveVoiceMode && !session.voiceMode){
    voiceConversationActive = false;
  }

  input.value = '';
  sendBtn.disabled = true;
  addUserMessage(text);
  history.push({ role: 'user', content: text });
  addTyping();

  try{
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        systemPrompt: buildSystemPrompt(currentLang),
        messages: history
      })
    });
    const data = await response.json();
    removeTyping();
    if(!response.ok){
      console.error('API error:', data.error);
      addBotMessage(UI[currentLang].error);
      return;
    }
    const emailResult = extractCapturedEmail(data.reply);
    const levelResult = extractEstimatedLevel(emailResult.cleaned);

    addBotMessage(levelResult.cleaned);
    history.push({ role: 'assistant', content: levelResult.cleaned });
    speakBotReply(levelResult.cleaned);

    if(emailResult.email){
      notifyOwner(emailResult.email, text);
    }

    if(levelResult.level){
      session.level = levelResult.level;
      session.mode = null;
      session.topic = null;
      session.phase = 'mode';

      setTimeout(() => {
        const f = FLOW_UI[currentLang] || FLOW_UI.en;
        addBotMessage(f.estimatedLevel(levelResult.level));
        showModeSelection();
      }, 300);
    }
  }catch(err){
    removeTyping();
    addBotMessage(UI[currentLang].error);
    console.error(err);
  }finally{
    sendBtn.disabled = false;
  }
}
changeModeBtn.addEventListener('click', () => {
  session.mode = null;
  session.topic = null;
  session.phase = 'mode';

  showModeSelection();

  const f = FLOW_UI[currentLang] || FLOW_UI.en;
  addBotMessage(f.modeChanged);
});
sendBtn.addEventListener('click', () => {
  session.voiceMode = false;
  voiceConversationActive = false;
  sendMessage();
});
input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    session.voiceMode = false;
    voiceConversationActive = false;
    sendMessage();
  }
});
</script>
